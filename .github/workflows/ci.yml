name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar-tests:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      # Every hand-mirrored contract at once, marked `mirror` rather than listed. It is a subset of
      # the run above - one second, so running it twice costs nothing - and it is here as well as in
      # its own job because some of those guards import the runtime they check: `app.dataset_status`
      # brings in the whole app, and the annotator's own copies reach the dataset tooling
      # (`label_progress` -> `clean_v2` -> pillow and numpy). The fast job below covers the rest.
      - name: The hand-mirrored contracts, both directions
        run: python -m pytest -q -m mirror

      # The docs' claims about the code, marked `docs`: a class count, a settings default, a floor,
      # a split ratio, a split name, an artifact name - and the sync that rewrites the ones it can
      # (`tools/docs_sync.py`, exercised site by site in `tests/test_docs_sync.py`). Both read the
      # run sheet, the training doc, the run-desktop skill and `CLAUDE.md` against the modules that
      # own each fact, which is why this is here and not in the fast job below - those modules
      # include the dataset tooling.
      - name: The docs' claims about the code, both directions
        run: python -m pytest -q -m docs

  two-toolchain-mirrors:
    name: Two-toolchain mirrors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ones whose whole dependency is pytest plus `pydantic`: the `Settings` defaults and the
      # picker's vocabularies in `desktop/.../settingsDefaults.ts` and `settingsFields.ts`, the WS
      # and REST shapes in `ws.ts`/`api.ts`, the fixtures under `src/test/`, the spawn handshake in
      # `desktop/src/main` + the Makefile, and the field list and bounds compared against the
      # sidecar's own models.
      #
      # Its own job rather than a step inside `sidecar-tests`, because a drift failure is read for
      # the *pair* it broke: the job name and the test name say which of the two sides moved, and
      # that is the whole diagnosis.
      #
      # The module paths are listed rather than `-m mirror` over the whole directory on purpose:
      # pytest imports every module it collects before it applies a marker, so a directory-wide run
      # would need the full runtime (torch included) to compare settings *names*. The two guards
      # absent here - the sidecar's copies of the dataset tooling's names, and the annotator's -
      # import the runtime they check, so they run under `-m mirror` in `sidecar-tests`, which
      # installs requirements.
      - name: Install pytest and pydantic
        run: pip install pytest pydantic

      - name: The hand-mirrored contracts that only read files
        run: >-
          python -m pytest -q -m mirror
          tests/test_settings.py
          tests/test_desktop_contracts.py

  desktop-tests:
    name: Desktop tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `--max-warnings 0` (set in package.json) rather than a plain `eslint .`: a warning here is a
      # prettier disagreement between two editors, and the way six of them accumulate is that none
      # of them fails anything. Green means the tree is formatted the way the formatter wants it.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docs-links:
    name: Doc link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails when a relative link between the tracked Markdown files points at a
      # path that does not exist (a rename or move that left a cross-reference
      # dangling). Standard library only, so it needs no dependency install.
      - name: Check internal documentation links
        run: python scripts/check_doc_links.py
