name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sidecar-tests:
    name: Sidecar tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: sidecar/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  two-toolchain-mirrors:
    name: Two-toolchain mirrors
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Several contracts are restated by hand between the two toolchains - the `Settings`
      # defaults and the picker's vocabularies in `desktop/.../settingsDefaults.ts` and
      # `settingsFields.ts` - and nothing on the desktop side can import the sidecar to check
      # them, so the guards live on this side and read the desktop files.
      #
      # Its own job rather than a step inside `sidecar-tests`, because a drift failure is read for
      # the *pair* it broke: the job name and the test name say which of the two sides moved, and
      # that is the whole diagnosis. `pytest` alone installs it: the guards import the settings
      # modules, which are stdlib-only until `resolve_device` reaches for torch.
      - name: Install pytest
        run: pip install pytest

      - name: The hand-mirrored settings contracts, both directions
        run: python -m pytest tests/test_settings.py -q -k mirror

  desktop-tests:
    name: Desktop tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `--max-warnings 0` (set in package.json) rather than a plain `eslint .`: a warning here is a
      # prettier disagreement between two editors, and the way six of them accumulate is that none
      # of them fails anything. Green means the tree is formatted the way the formatter wants it.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  docs-links:
    name: Doc link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails when a relative link between the tracked Markdown files points at a
      # path that does not exist (a rename or move that left a cross-reference
      # dangling). Standard library only, so it needs no dependency install.
      - name: Check internal documentation links
        run: python scripts/check_doc_links.py
